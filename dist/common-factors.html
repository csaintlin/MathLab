<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>分組找公因數｜小小數學所</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="triangle.css"><link rel="stylesheet" href="visual-labs.css"><link rel="stylesheet" href="number-labs.css"><link rel="stylesheet" href="site-shell.css">
<script src="site-shell.js" defer></script>
</head><body data-site-layout="lesson" data-number-lab="common-factors"><header class="site-header">
  <a class="site-brand" href="common-factors.html"><span class="site-logo" aria-hidden="true">▦</span><span class="site-brand-name">分組找公因數</span><span class="site-brand-sub">數學探索室</span></a>
  <nav class="site-nav" aria-label="頁面導覽">
    <a href="./#grade-5">數學入口</a>
    <a href="common-factors.html" aria-current="page">公因數</a>
    <a href="common-factors-quiz.html">隨機練習</a>
    <a href="common-multiples.html">公倍數</a>
  </nav>
  <button class="site-fullscreen" type="button" hidden><span aria-hidden="true">⛶</span> <span class="site-fullscreen-text">全螢幕</span></button>
</header><main>
  <section class="intro"><div><h1>分組找公因數</h1><p class="subtitle">上下兩列都有的數字就是公因數。點一個因數，看兩種點心怎麼分。</p></div></section>
  <section class="board-card lab-board">
      <form id="number-settings" class="lab-controls number-settings">
        <label>第一個數 <input id="first" value="12" inputmode="numeric" maxlength="2" pattern="[0-9]{1,2}" required></label>
        <label>第二個數 <input id="second" value="18" inputmode="numeric" maxlength="2" pattern="[0-9]{1,2}" required></label>
        <button>套用</button><button type="button" id="random">⤨ 換一組</button>
        <span class="range-hint">輸入 1～50 的整數</span>
      </form>
    <div class="number-stage">
      <div class="factor-row">
        <h2 id="factor-title">比較兩個數的因數</h2>
        <div id="factor-options" class="factor-comparison" role="group" aria-labelledby="factor-title"></div>
      </div>
      <p id="feedback" role="status"></p>
    </div>
    <p class="common-factor-summary"><strong>找到的公因數</strong> <span id="found"></span></p>
    <p id="largest-result" hidden></p>
  </section>
  <section class="board-card discovery" aria-labelledby="distribution-title">
    <h2 id="distribution-title"></h2>
    <div id="distribution" class="distribution-grid"></div>
  </section>
</main>
<footer class="site-footer">
  <span>小小數學所 · 把抽象的數學，變成看得見的發現。</span>
  <span>兩種點心都剛好分完，就找到一個公因數。</span>
</footer>
<script src="common-factors.js" type="module"></script></body></html>
