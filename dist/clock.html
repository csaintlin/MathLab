<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小時鐘｜小小數學所</title><link rel="stylesheet" href="clock.css"><link rel="stylesheet" href="site-shell.css">

</head><body data-site-layout="lesson"><header class="site-header">

</header><main><div class="intro"><p class="eyebrow">二年級 · 認識時間</p><h1>小小時鐘</h1><p>用手轉一轉，看看現在是幾點幾分！</p></div><section class="workspace"><div class="clock-panel"><div class="legend"><span class="hour-color">● 短短的時針</span><span class="minute-color">● 長長的分針</span></div><svg id="clock" viewBox="0 0 440 440" aria-label="互動時鐘，可拖動時針與分針"><circle cx="220" cy="220" r="209" fill="#e6eddf"/><circle cx="220" cy="220" r="195" fill="#fffefa" stroke="#cbd7c3" stroke-width="2"/><g id="ticks"></g><g id="numbers"></g><g id="minute-labels"></g><g id="hour-hand" class="hand" role="slider" tabindex="0" aria-label="時針" aria-valuemin="1" aria-valuemax="12"><line class="hit" x1="220" y1="229" x2="220" y2="119"/><line x1="220" y1="229" x2="220" y2="119" stroke="#c56a37" stroke-width="13" stroke-linecap="round"/><circle cx="220" cy="119" r="10" fill="#c56a37"/></g><g id="minute-hand" class="hand" role="slider" tabindex="0" aria-label="分針" aria-valuemin="0" aria-valuemax="59"><line class="hit" x1="220" y1="236" x2="220" y2="66"/><line x1="220" y1="236" x2="220" y2="66" stroke="#287765" stroke-width="8" stroke-linecap="round"/><circle cx="220" cy="66" r="9" fill="#287765"/></g><circle cx="220" cy="220" r="13" fill="#304f40"/><circle cx="220" cy="220" r="5" fill="#fffefa"/></svg><p class="drag-tip">☝ 拖動指針上的圓點，試試看！</p><label class="toggle"><input id="show-minutes" type="checkbox" checked> 顯示分鐘小提示</label></div><div class="controls"><div class="time-card"><p>現在的時間</p><div class="digital" aria-label="數字時鐘"><span id="digital-hour" class="hour-color">03</span><b>:</b><span id="digital-minute" class="minute-color">00</span></div><p id="spoken" aria-live="polite">3 點整</p></div><div class="adjust"><div><h2 class="hour-color">短針看「幾點」</h2><div class="button-row"><button data-delta="-60" aria-label="減少一小時">− 1 小時</button><button data-delta="60" aria-label="增加一小時">＋ 1 小時</button></div></div><div><h2 class="minute-color">長針看「幾分」</h2><div class="button-row"><button data-delta="-1">− 1 分</button><button data-delta="1">＋ 1 分</button></div><div class="button-row"><button data-delta="-5">− 5 分</button><button data-delta="5">＋ 5 分</button></div></div></div><div class="presets"><p>轉到這個時間看看</p><button data-time="480">8 點整</button><button data-time="510">8 點半</button><button data-time="555">9 點 15 分</button></div><button id="reset" class="reset">↺ 回到 3 點整</button></div></section><aside><strong>小發現</strong><p>分針走 1 小格是 <b>1 分鐘</b>，走 1 大格是 <b>5 分鐘</b>。<br>分針走完一圈是 <b>60 分鐘</b>，時針就往前走 <b>1 小時</b>！</p></aside></main>
