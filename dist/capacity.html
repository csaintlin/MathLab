</header><main class="capacity-lesson">
  <div class="intro">
    <p class="eyebrow">二年級 · 容量與觀察</p>
    <h1>容量觀察實驗</h1>
    <p>哪一杯的水最多？先猜一猜，再倒水比較。</p>
  </div>
  <div class="toolbar"><button id="new" type="button">重新裝水 ↻</button></div>
  <section>
    <h2><span>1</span> 先猜猜看</h2>
    <p class="hint">三個杯子的形狀和水位都可能不同。選出你猜水最多的一杯。</p>
    <div id="containers" class="containers"></div>
    <p id="prediction" class="hint" role="status"></p>
  </section>
  <section>
    <h2><span>2</span> 倒進一樣大的量杯</h2>
    <p class="hint">每杯水倒進自己的量杯。倒完的水會留在量杯裡，可以一起比較水位。</p>
    <div id="records" class="containers"></div>
    <p id="status" class="hint" role="status"></p>
  </section>
  <section>
    <h2><span>3</span> 看看哪一杯水最多</h2>
    <p id="conclusion" role="status"></p>
  </section>
  <aside>
    <strong>小發現</strong>
    <p>原本的杯子形狀不同，水位較高的那杯，水量也可能較少。倒進一樣大的量杯後，水位最高的那杯水最多。</p>
    <p>這次比的是杯子現在裝了多少水。把杯子裝滿時能裝多少，是它的最大容量。</p>
  </aside>
  <div class="check-row"><button id="again" class="primary" type="button">再玩一次 ↻</button></div>
</main>
<footer class="site-footer">
  <span>小小數學所 · 把抽象的數學，變成看得見的發現。</span>
